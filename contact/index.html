<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Yuxuan (Kate) Zhou about data science, research, and creative projects.">
  <title>Contact — Yuxuan Zhou</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="inner-page">
  <main class="page-main" id="main-content">
    <header class="page-heading">
      <p class="eyebrow">Get in touch</p>
      <h1 class="page-title">Let's talk.</h1>
      <p class="page-description">Have a question about my work or an idea to share? I'd love to hear from you.</p>
    </header>
    <section class="surface contact-surface" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Say hello</h2>
      <p>You can reach me at <a class="text-link" href="mailto:yuz235@ucsd.edu">yuz235@ucsd.edu</a>, or start a draft below.</p>
      <form class="contact-form" action="mailto:yuz235@ucsd.edu" method="get" aria-describedby="email-help">
        <div class="form-field">
          <label for="contact-email">Your email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
          <label for="contact-subject">Subject</label>
          <input id="contact-subject" name="subject" type="text" placeholder="What would you like to talk about?" required>
        </div>
        <div class="form-field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="body" rows="6" placeholder="Hi Yuxuan…" required></textarea>
        </div>
        <p id="email-help" class="form-help">This opens a draft in your email app. You can review and send it there.</p>
        <button class="button" type="submit">Open email draft <span aria-hidden="true">↗</span></button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script type="module" src="../global.js"></script>
  <script type="module" src="contact.js"></script>
</body>
</html>
