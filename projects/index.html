<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Yuxuan Zhou’s projects in machine learning, healthcare research, data visualization, and design.">
  <meta name="theme-color" content="#ada5d6">
  <link rel="stylesheet" href="../style.css">
  <title>Projects — Yuxuan (Kate) Zhou</title>
</head>
<body class="inner-page projects-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="page-main">
    <header class="page-heading">
      <p class="eyebrow">A little curiosity. A lot of exploring.</p>
      <h1 class="page-title">My projects.</h1>
      <p class="page-description">From healthcare and machine learning to interactive visualizations and design.</p>
    </header>
    <section aria-label="Browse projects">
      <div class="project-toolbar">
        <div class="year-filters" role="group" aria-label="Filter projects by year"></div>
        <label class="search-field">
          <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          <span class="sr-only">Search projects</span>
          <input class="searchBar" type="search" placeholder="Search projects…" autocomplete="off">
        </label>
      </div>
      <p class="project-count" role="status" aria-live="polite">Loading projects…</p>
      <div class="projects all-projects" aria-busy="true"></div>
      <div class="empty-state" id="no-projects" hidden>
        <h2>No projects found.</h2>
        <p>Try another search or choose a different year.</p>
        <button class="button secondary" id="reset-filters" type="button">Reset filters</button>
      </div>
      <noscript><p>Please enable JavaScript to search and filter all eight projects. You can also read the <a href="sepsis.html">Sepsis Sentinel</a> and <a href="multimorbidity.html">multimorbidity</a> overviews.</p></noscript>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script type="module" src="../global.js"></script>
  <script type="module" src="projects.js"></script>
</body>
</html>
